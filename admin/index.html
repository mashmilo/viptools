<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><meta name=robots content=noindex><title>Admin</title><link rel=stylesheet href=/style.css><main class=w><h1>VipTools Admin</h1><div class=box id=a></div></main><script>
const HASH="e8b0b7880ff01750e0e44b0236e58e5ce9830f1b32bcd2866128f0818f9eba11",$=i=>document.getElementById(i);let c;
async function sha(s){return[...new Uint8Array(await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,"0")).join("")}
function login(){a.innerHTML='<input id=u placeholder=Username><input id=p type=password placeholder=Password><button onclick=go()>Login</button><p id=m class=err></p>'}
async function go(){if(await sha(u.value+":"+p.value)==HASH){sessionStorage.k=1;load()}else m.textContent="Wrong username or password"}
async function load(){c=await(await fetch("/config.json?"+Date.now())).json();draw()}
const F=[["siteName","Site name"],["adsenseClient","AdSense client (ca-pub-XXXX)"],["adsHeader","Ad code (shown in every ad slot)"],["gaId","Google Analytics ID (G-XXXX)"],["gscVerification","Search Console verification code"]];
function draw(){a.innerHTML=F.map(f=>`<label>${f[1]}<input id=f_${f[0]} value="${(c[f[0]]||"").replace(/"/g,"&quot;")}"></label>`).join("")+"<h2>Tools (on/off, delete)</h2>"+c.tools.map((t,i)=>`<div class=row><label><input type=checkbox ${t.enabled?"checked":""} onchange="c.tools[${i}].enabled=this.checked"> ${t.name}</label><button class=alt onclick="c.tools.splice(${i},1);draw()">Delete</button></div>`).join("")+`<h2>Add new tool</h2><input id=ns placeholder="slug e.g. my-tool"><input id=nn placeholder="Name"><input id=nd placeholder="Short description"><textarea id=nh rows=4 placeholder="Tool HTML + script (optional)"></textarea><textarea id=na rows=4 placeholder="Article HTML (optional)"></textarea><button onclick=add()>Add tool</button><h2>Save</h2><label>GitHub token (saved on this device only)<input id=tk type=password value="${localStorage.tk||""}"></label><button onclick=save()>Save to GitHub</button> <button class=alt onclick=dl()>Download config.json</button><p id=m></p>`}
function sync(){F.forEach(f=>c[f[0]]=$("f_"+f[0]).value)}
function add(){sync();c.tools.push({slug:ns.value,name:nn.value,desc:nd.value,html:nh.value,article:na.value,enabled:true});draw()}
function dl(){sync();const l=document.createElement("a");l.href=URL.createObjectURL(new Blob([JSON.stringify(c,null,1)]));l.download="config.json";l.click()}
async function save(){sync();localStorage.tk=tk.value;const u="https://api.github.com/repos/mashmilo/viptools/contents/config.json",h={Authorization:"Bearer "+tk.value,Accept:"application/vnd.github+json"};try{const g=await(await fetch(u,{headers:h})).json();const r=await fetch(u,{method:"PUT",headers:h,body:JSON.stringify({message:"Update config",sha:g.sha,content:btoa(unescape(encodeURIComponent(JSON.stringify(c,null,1))))})});m.textContent=r.ok?"Saved! Site updates in about a minute.":"Failed: "+r.status}catch(e){m.textContent="Error: "+e.message}}
sessionStorage.k?load():login()</script>
